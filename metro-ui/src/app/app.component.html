<div *ngIf="!isLoginPage()">
  <div class="wrapper">
    <app-side-nav></app-side-nav>
    <div id="content">
      <nav class="top-navbar">
        <div class="navbar-left">
          <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Search..." />
          </div>
        </div>
        <div class="navbar-right">
          <div class="nav-item notification-bell">
            <i class="fas fa-bell"></i>
            <span class="notification-badge">3</span>
          </div>
          <div class="nav-divider"></div>
          <div class="user-info" [class.show-dropdown]="showUserDropdown" (click)="toggleUserDropdown()">
            <div class="user-avatar">
              <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-details">
              <span class="user-name">{{ loggedInUser }}</span>
              <span class="user-role">Administrator</span>
            </div>
            <i class="fas fa-chevron-down dropdown-arrow"></i>
            <div class="user-dropdown" *ngIf="showUserDropdown">
              <a class="dropdown-item" routerLink="/settings/profile">
                <i class="fas fa-user"></i> My Profile
              </a>
              <a class="dropdown-item" routerLink="/settings/preferences">
                <i class="fas fa-cog"></i> Settings
              </a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item logout-item" (click)="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </div>
          </div>
        </div>
      </nav>

      <div class="main-content">
        <app-loader [isLoading]="loading"></app-loader>
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
<div *ngIf="isLoginPage()">
  <app-login></app-login>
</div>
