<div class="cmrl-loader-overlay" *ngIf="isLoading">
  <div class="cmrl-loader">
    <div class="loader-container">
      <svg class="loader-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" class="track"></circle>
        <circle cx="50" cy="10" r="6" class="train"></circle>
        <text x="50" y="50" class="cmrl-text">CMRL</text>
        <text x="50" y="62" class="cmrl-subtext">Loading...</text>
      </svg>
    </div>
  </div>
</div>
