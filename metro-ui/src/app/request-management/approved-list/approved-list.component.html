<div class="card mt-1">
  <div *ngIf="pendingGridOption">
    <div class="d-grid gap-2 d-md-flex justify-content-md-end" style="padding: 10px 22px 0px 0px;">
      <!--<button class="btn btn-primary me-md-2" type="button" mdbRipple>Download</button>-->
      <button class="btn btn-primary" type="button" (click)="onExport()" mdbRipple><i class="fa fa-download" style="margin-right:5px;"></i> Download</button>
    </div>
    <ag-grid-angular style="width: 100%; height: 100%; padding: 10px 20px 20px 20px;"
                     class="ag-theme-alpine"
                     [rowData]="rowData"
                     [columnDefs]="columnDefs"
                     [gridOptions]="pendingGridOption">
    </ag-grid-angular>
  </div>
</div>
