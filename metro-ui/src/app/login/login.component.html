<div class="login-page">
  <div class="login-overlay"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <img src="/assets/images/cmrl_logo3.webp"
             class="login-logo"
             alt="CMRL Logo" />
        <h4 class="login-title">Chennai Metro Rail Limited</h4>
        <p class="login-subtitle">Work Request Management System</p>
      </div>
      <div class="login-form-section">
        <h5 class="welcome-text">Welcome Back!</h5>
        <p class="login-hint">Sign in to your account to continue</p>

        <mdb-form-control class="mb-4">
          <input mdbInput type="email" id="form1Example1" class="form-control" [formControl]="$any(loginForm.controls['username'])" required />
          <label mdbLabel class="form-label" for="form1Example1">User Name / Email address</label>
          <mdb-error *ngIf="(loginForm.controls['username']?.touched || isformValid) && (loginForm.controls['username'].errors?.['required'])">
            User Name is required
          </mdb-error>
        </mdb-form-control>

        <mdb-form-control class="mb-4">
          <input mdbInput type="password" id="form1Example2" class="form-control" [formControl]="$any(loginForm.controls['password'])" required />
          <label mdbLabel class="form-label" for="form1Example2">Password</label>
          <mdb-error style="margin-bottom:2px;" *ngIf="(loginForm.controls['password']?.touched || isformValid) && (loginForm.controls['password'].errors?.['required'])">
            Password is required
          </mdb-error>
        </mdb-form-control>

        <button mdbRipple type="button" class="btn btn-signin" (click)="getlogindetls()">
          <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Sign In
        </button>
      </div>
    </div>
  </div>
</div>
